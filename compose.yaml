services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: postready
      POSTGRES_DB: postready
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postready-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postready -d postready"]
      interval: 5s
      timeout: 3s
      retries: 15
  minio:
    build: ./infra/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    volumes: ["postready-images:/data"]
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postready:${POSTGRES_PASSWORD}@db:5432/postready
      MINIO_ENDPOINT: minio:9000
    ports: ["127.0.0.1:8010:8000"]
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
  web:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
    ports: ["127.0.0.1:3010:3000"]
    depends_on: [api]
volumes:
  postready-db:
  postready-images:
